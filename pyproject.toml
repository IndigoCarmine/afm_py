[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "afm-py"
version = "0.1.0"
description = "Reader and file-conversion filters for Bruker Nanoscope AFM/SPM files (Rust core)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "afm_py contributors" }]
keywords = ["AFM", "SPM", "Nanoscope", "Bruker", "microscopy"]
dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
# Image export (PNG/TIFF) needs Pillow; extra colormaps / plotting need matplotlib.
png = ["pillow>=9"]
viz = ["matplotlib>=3.4"]
all = ["pillow>=9", "matplotlib>=3.4"]

[project.scripts]
afm-convert = "afm_files.cli:main"

[tool.maturin]
# Mixed Rust/Python project: Rust in src/lib.rs -> afm_files._core,
# Python package under python/afm_files.
module-name = "afm_files._core"
python-source = "python"
features = ["pyo3/extension-module"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
]
